name: Check research API connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify API access without exposing the key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error, json
          key = os.environ.get('OPENAI_API_KEY')
          if not key:
              raise SystemExit('Missing OPENAI_SECRET_KEY repository secret')
          request = urllib.request.Request('https://api.openai.com/v1/models', headers={'Authorization': 'Bearer ' + key})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  models = json.load(response)['data']
              print('API authentication succeeded.')
              available = {m['id'] for m in models}
              for model in ['gpt-5.6-sol']:
                  print(model + ': ' + ('available' if model in available else 'not listed'))
              payload = json.dumps({'model': 'gpt-5.6-sol', 'reasoning': {'effort': 'none'}, 'input': 'Reply with OK.', 'max_output_tokens': 32}).encode()
              paid_request = urllib.request.Request('https://api.openai.com/v1/responses', data=payload, headers={'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json'})
              with urllib.request.urlopen(paid_request, timeout=90) as response:
                  result = json.load(response)
              print('Response API billing test completed: ' + result.get('status', 'unknown'))
          except urllib.error.HTTPError as error:
              try:
                  details = json.load(error).get('error', {})
                  error_type = details.get('code') or details.get('type') or 'unknown'
              except Exception:
                  error_type = 'unknown'
              raise SystemExit('API request failed with HTTP ' + str(error.code) + ' (' + str(error_type) + ')')
          PY
